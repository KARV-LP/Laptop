name: Diagnostic safety

on:
  pull_request:
    paths:
      - 'scripts/diagnostic/**'
      - 'tests/Test-DiagnosticSafety.ps1'
      - '.github/workflows/diagnostic-safety.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-safety:
    name: PowerShell safety and runtime
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate baseline diagnostic directly
        shell: powershell
        run: .\tests\Test-DiagnosticSafety.ps1

      - name: Validate baseline documented invocation
        shell: cmd
        run: powershell.exe -NoProfile -File ".\tests\Test-DiagnosticSafety.ps1"

      - name: Validate targeted diagnostic directly
        shell: powershell
        run: .\tests\Test-DiagnosticSafety.ps1 -ScriptPath ".\scripts\diagnostic\Invoke-KarvStorageSecurityDiagnostic.ps1"

      - name: Validate targeted documented invocation
        shell: cmd
        run: powershell.exe -NoProfile -File ".\tests\Test-DiagnosticSafety.ps1" -ScriptPath ".\scripts\diagnostic\Invoke-KarvStorageSecurityDiagnostic.ps1"

      - name: Execute baseline read-only diagnostic smoke test
        shell: powershell
        run: |
          $outputDirectory = Join-Path $env:RUNNER_TEMP 'KARV-LaptopDiagnostics-Smoke'

          & powershell.exe -NoProfile -File ".\scripts\diagnostic\Invoke-KarvReadOnlyDiagnostic.ps1" `
            -OutputDirectory $outputDirectory `
            -SkipCacheScan

          if ($LASTEXITCODE -ne 0) {
              throw 'Diagnostic smoke test returned a non-zero exit code.'
          }

          $jsonReports = @(Get-ChildItem -LiteralPath $outputDirectory -Filter 'karv-laptop-diagnostic-*.json' -File)
          $markdownReports = @(Get-ChildItem -LiteralPath $outputDirectory -Filter 'karv-laptop-summary-*.md' -File)

          if ($jsonReports.Count -ne 1) {
              throw 'Diagnostic smoke test did not create exactly one JSON report.'
          }

          if ($markdownReports.Count -ne 1) {
              throw 'Diagnostic smoke test did not create exactly one Markdown report.'
          }

          $jsonText = Get-Content -LiteralPath $jsonReports[0].FullName -Raw -Encoding UTF8
          $report = $jsonText | ConvertFrom-Json

          if ($report.ScriptVersion -ne '1.0.3') {
              throw 'Unexpected diagnostic script version in smoke-test report.'
          }

          if (-not $report.Privacy.Sanitized) {
              throw 'Smoke-test report is not marked as sanitized.'
          }

          if ($report.Privacy.SidCollected -ne $false) {
              throw 'Smoke-test report does not explicitly disable SID collection.'
          }

          if (@($report.SectionFailures).Count -ne 0) {
              throw 'Diagnostic smoke test reported unavailable sections.'
          }

          if (@($report.Applications).Count -lt 1) {
              throw 'Applications inventory is unexpectedly empty.'
          }

          if ($jsonText -match '\bS-1-\d+(?:-\d+)+\b') {
              throw 'Diagnostic report contains an unsanitized Windows SID.'
          }

          $redactedApplicationVersions = @($report.Applications | Where-Object {
              ([string]$_.Name).Contains('<IP>') -or
              ([string]$_.Version).Contains('<IP>')
          })
          if ($redactedApplicationVersions.Count -gt 0) {
              throw 'Application names or versions were incorrectly replaced by the IP marker.'
          }

          $markdown = Get-Content -LiteralPath $markdownReports[0].FullName -Raw -Encoding UTF8
          if ($markdown -notmatch '# Diagnostico KARV - resumo sanitizado') {
              throw 'Markdown summary header is missing or incorrectly encoded.'
          }

          $mojibakeMarkers = @([char]0x00C3, [char]0x00C2, [char]0x00E2)
          foreach ($marker in $mojibakeMarkers) {
              if ($markdown.IndexOf([string]$marker, [System.StringComparison]::Ordinal) -ge 0) {
                  throw 'Markdown summary contains a mojibake marker.'
              }
          }

          Write-Host 'Baseline diagnostic runtime smoke test passed.'

      - name: Execute targeted storage and security smoke test
        shell: powershell
        run: |
          $outputDirectory = Join-Path $env:RUNNER_TEMP 'KARV-StorageSecurity-Smoke'

          & powershell.exe -NoProfile -File ".\scripts\diagnostic\Invoke-KarvStorageSecurityDiagnostic.ps1" `
            -OutputDirectory $outputDirectory `
            -EventLookbackDays 1 `
            -MaxDiskEvents 5

          if ($LASTEXITCODE -ne 0) {
              throw 'Targeted diagnostic returned a non-zero exit code.'
          }

          $jsonReports = @(Get-ChildItem -LiteralPath $outputDirectory -Filter 'karv-storage-security-*.json' -File)
          $markdownReports = @(Get-ChildItem -LiteralPath $outputDirectory -Filter 'karv-storage-security-summary-*.md' -File)

          if ($jsonReports.Count -ne 1) {
              throw 'Targeted diagnostic did not create exactly one JSON report.'
          }

          if ($markdownReports.Count -ne 1) {
              throw 'Targeted diagnostic did not create exactly one Markdown report.'
          }

          $jsonText = Get-Content -LiteralPath $jsonReports[0].FullName -Raw -Encoding UTF8
          $report = $jsonText | ConvertFrom-Json

          if ($report.Collector -ne 'StorageSecurity' -or $report.ScriptVersion -ne '1.0.0') {
              throw 'Unexpected targeted collector identity or version.'
          }

          if (-not $report.Privacy.Sanitized) {
              throw 'Targeted report is not marked as sanitized.'
          }

          $requiredFalseMarkers = @(
              'ComputerNameCollected',
              'UserNameCollected',
              'SidCollected',
              'SerialCollected',
              'NetworkCollected',
              'EventMessagesCollected',
              'SecurityPathsCollected',
              'SecurityGuidsCollected'
          )

          foreach ($propertyName in $requiredFalseMarkers) {
              if ($report.Privacy.$propertyName -ne $false) {
                  throw ('Targeted privacy marker is not false: ' + $propertyName)
              }
          }

          if (@($report.SectionFailures).Count -ne 0) {
              throw 'Targeted diagnostic reported unavailable core sections.'
          }

          if (@($report.DiskInventory).Count -lt 1) {
              throw 'Targeted diagnostic did not inventory any disks.'
          }

          if ($jsonText -match '\bS-1-\d+(?:-\d+)+\b') {
              throw 'Targeted report contains an unsanitized Windows SID.'
          }

          if ($jsonText -match '"(?:Message|SerialNumber|UniqueId|InstanceGuid|PathToSignedProductExe|PathToSignedReportingExe)"\s*:') {
              throw 'Targeted report contains a prohibited property.'
          }

          $markdown = Get-Content -LiteralPath $markdownReports[0].FullName -Raw -Encoding UTF8
          if ($markdown -notmatch '# KARV - investigacao de armazenamento e seguranca') {
              throw 'Targeted Markdown summary header is missing.'
          }

          Write-Host 'Targeted storage and security runtime smoke test passed.'

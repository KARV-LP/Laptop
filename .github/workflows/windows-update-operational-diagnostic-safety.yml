name: Windows Update operational diagnostic safety

on:
  pull_request:
    paths:
      - 'scripts/diagnostic/Invoke-KarvWindowsUpdateOperationalDiagnostic.ps1'
      - 'tests/Test-WindowsUpdateOperationalDiagnosticSafety.ps1'
      - 'tests/Test-WindowsUpdateOperationalDiagnosticRuntime.ps1'
      - 'docs/fase-4c-windows-update-operational-diagnostic.md'
      - '.github/workflows/windows-update-operational-diagnostic-safety.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Read-only Windows Update operational diagnostic
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate synthetic safety contract
        shell: powershell
        run: |
          try {
              .\tests\Test-WindowsUpdateOperationalDiagnosticSafety.ps1 `
                -ScriptPath '.\scripts\diagnostic\Invoke-KarvWindowsUpdateOperationalDiagnostic.ps1'
          }
          catch {
              Write-Host 'Exception type:' $_.Exception.GetType().FullName
              Write-Host 'Exception message:' $_.Exception.Message
              Write-Host 'Position:' $_.InvocationInfo.PositionMessage
              Write-Host 'Script stack:' $_.ScriptStackTrace
              throw
          }

      - name: Validate documented Windows PowerShell 5.1 invocation
        shell: cmd
        run: >-
          powershell.exe -NoProfile -ExecutionPolicy Bypass
          -File ".\tests\Test-WindowsUpdateOperationalDiagnosticSafety.ps1"
          -ScriptPath ".\scripts\diagnostic\Invoke-KarvWindowsUpdateOperationalDiagnostic.ps1"

      - name: Execute real local registry service and event path
        shell: powershell
        run: |
          try {
              .\tests\Test-WindowsUpdateOperationalDiagnosticRuntime.ps1 `
                -ScriptPath '.\scripts\diagnostic\Invoke-KarvWindowsUpdateOperationalDiagnostic.ps1'
          }
          catch {
              Write-Host 'Exception type:' $_.Exception.GetType().FullName
              Write-Host 'Exception message:' $_.Exception.Message
              Write-Host 'Position:' $_.InvocationInfo.PositionMessage
              Write-Host 'Script stack:' $_.ScriptStackTrace
              throw
          }

      - name: Confirm change scope
        if: github.event_name == 'pull_request'
        shell: powershell
        run: |
          $baseSha = "${{ github.event.pull_request.base.sha }}"
          $headSha = "${{ github.event.pull_request.head.sha }}"
          $changed = @(git diff --name-only $baseSha $headSha)
          if ($LASTEXITCODE -ne 0) { throw 'Unable to compare pull request scope.' }
          $allowed = @(
              '.github/workflows/windows-update-operational-diagnostic-safety.yml',
              'docs/fase-4c-windows-update-operational-diagnostic.md',
              'scripts/diagnostic/Invoke-KarvWindowsUpdateOperationalDiagnostic.ps1',
              'tests/Test-WindowsUpdateOperationalDiagnosticRuntime.ps1',
              'tests/Test-WindowsUpdateOperationalDiagnosticSafety.ps1'
          )
          $unexpected = @($changed | Where-Object { $allowed -notcontains $_ })
          $missing = @($allowed | Where-Object { $changed -notcontains $_ })
          if ($unexpected.Count -ne 0) {
              throw ('Unexpected files in change scope: ' + ($unexpected -join '; '))
          }
          if ($missing.Count -ne 0) {
              throw ('Expected files absent from change scope: ' + ($missing -join '; '))
          }
          Write-Host 'Change scope is restricted to the five Fase 4C files.'

      - name: Confirm repository remains unchanged
        shell: powershell
        run: |
          $changes = @(git status --porcelain)
          if ($changes.Count -ne 0) {
              throw ('Safety tests changed tracked repository files: ' + ($changes -join '; '))
          }
          Write-Host 'Repository remained unchanged after safety tests.'

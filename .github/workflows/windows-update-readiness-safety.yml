name: Windows update readiness safety

on:
  pull_request:
    paths:
      - 'scripts/diagnostic/Invoke-KarvWindowsUpdateReadiness.ps1'
      - 'tests/Test-WindowsUpdateReadinessSafety.ps1'
      - 'tests/Test-WindowsUpdateReadinessRuntime.ps1'
      - 'docs/fase-4b-windows-update-readiness.md'
      - '.github/workflows/windows-update-readiness-safety.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Read-only Windows update readiness
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate synthetic safety contract
        shell: powershell
        run: |
          try {
              .\tests\Test-WindowsUpdateReadinessSafety.ps1 `
                -ScriptPath '.\scripts\diagnostic\Invoke-KarvWindowsUpdateReadiness.ps1'
          }
          catch {
              Write-Host 'Exception type:' $_.Exception.GetType().FullName
              Write-Host 'Exception message:' $_.Exception.Message
              Write-Host 'Position:' $_.InvocationInfo.PositionMessage
              Write-Host 'Script stack:' $_.ScriptStackTrace
              throw
          }

      - name: Validate documented Windows PowerShell 5.1 invocation
        shell: cmd
        run: >-
          powershell.exe -NoProfile -ExecutionPolicy Bypass
          -File ".\tests\Test-WindowsUpdateReadinessSafety.ps1"
          -ScriptPath ".\scripts\diagnostic\Invoke-KarvWindowsUpdateReadiness.ps1"

      - name: Execute real local history and registry path
        shell: powershell
        run: |
          try {
              .\tests\Test-WindowsUpdateReadinessRuntime.ps1 `
                -ScriptPath '.\scripts\diagnostic\Invoke-KarvWindowsUpdateReadiness.ps1'
          }
          catch {
              Write-Host 'Exception type:' $_.Exception.GetType().FullName
              Write-Host 'Exception message:' $_.Exception.Message
              Write-Host 'Position:' $_.InvocationInfo.PositionMessage
              Write-Host 'Script stack:' $_.ScriptStackTrace
              throw
          }

      - name: Confirm change scope
        if: github.event_name == 'pull_request'
        shell: powershell
        run: |
          $baseSha = "${{ github.event.pull_request.base.sha }}"
          $headSha = "${{ github.event.pull_request.head.sha }}"
          git cat-file -e ($baseSha + '^{commit}')
          if ($LASTEXITCODE -ne 0) { throw 'Base commit is unavailable.' }
          git cat-file -e ($headSha + '^{commit}')
          if ($LASTEXITCODE -ne 0) { throw 'Head commit is unavailable.' }
          $changed = @(git diff --name-only $baseSha $headSha)
          if ($LASTEXITCODE -ne 0) { throw 'Unable to compare change scope.' }
          $allowed = @(
              'scripts/diagnostic/Invoke-KarvWindowsUpdateReadiness.ps1',
              'tests/Test-WindowsUpdateReadinessSafety.ps1',
              'tests/Test-WindowsUpdateReadinessRuntime.ps1',
              'docs/fase-4b-windows-update-readiness.md',
              '.github/workflows/windows-update-readiness-safety.yml'
          )
          $violations = @($changed | Where-Object { $allowed -notcontains $_ })
          if ($violations.Count -ne 0) {
              throw ('Files outside Fase 4B were modified: ' + ($violations -join '; '))
          }
          Write-Host 'Only Fase 4B files were changed.'

      - name: Confirm repository remains unchanged
        shell: powershell
        run: |
          $changes = @(git status --porcelain)
          if ($changes.Count -ne 0) {
              throw ('Safety tests changed tracked repository files: ' + ($changes -join '; '))
          }
          Write-Host 'Repository remained unchanged after safety tests.'
